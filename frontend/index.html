<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小北寝室自动打卡 - Web 端</title>
    <script>
      // 首帧前恢复外观，避免先渲染默认样式再跳变。两条轴各管一件事：
      //   色相 —— 非默认主题给 <html> 挂 theme- + id（与 tailwindcss-themer 的主题名约定一致）；
      //   明暗 —— 给 <html> 挂 data-mode（auto 时读系统偏好）。
      // 色板与持久化键见 src/config/themePalette.js 与 stores/theme.js，新增主题需沿用命名约定。
      try {
        var __t = localStorage.getItem('xb_theme')
        if (__t && __t !== 'ocean') document.documentElement.classList.add('theme-' + __t)
        var __m = localStorage.getItem('xb_mode')
        if (__m !== 'light' && __m !== 'dark') {
          __m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-mode', __m)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
